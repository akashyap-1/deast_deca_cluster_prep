<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./cougar.png" />
    <link rel="apple-touch-icon" href="./cougar.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1a3d" />
    <meta name="description" content="DECA cluster exam practice for Downingtown East DECA." />
    <meta name="robots" content="noindex" />
    <title>East DECA Prep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Dark is the default.
      try {
        var t = localStorage.getItem('eastdeca:theme') || 'dark';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (!dark) document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
